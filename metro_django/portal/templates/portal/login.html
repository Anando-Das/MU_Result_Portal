{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Log In — Metropolitan University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>
<body>
  <!-- Navigation -->
  <nav id="main-nav" class="auth-nav">
    <div class="nav-main-inner">
      <a href="{% url 'portal:welcome' %}" class="nav-logo">
        <img src="{% static 'images/metropolitan-logo.png' %}" alt="Metropolitan University" />
      </a>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to your student account</p>

      <!-- Tab Selector -->
      <div class="auth-tabs" style="display: flex; background: rgba(10,22,40,0.6); border-radius: 8px; padding: 4px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.1);">
        <a href="{% url 'portal:login' %}" style="flex: 1; text-align: center; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);">Student Login</a>
        <a href="{% url 'portal:teachers.login' %}" style="flex: 1; text-align: center; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; color: #94a3b8; transition: all 0.3s ease;">Faculty Login</a>
      </div>

      {% if messages %}
        <div class="alert alert-error" style="padding: 15px; margin-bottom: 15px; border-radius: 4px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
          <ul style="margin: 0; padding-left: 20px;">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form method="POST" action="{% url 'portal:login' %}" class="auth-form">
        {% csrf_token %}

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input"
            placeholder="your.email@university.edu"
            value="{{ old_email|default:'' }}"
            required
            autofocus
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-red-auth">Log In</button>

        <!-- Signup Link -->
        <p class="auth-toggle">
          Don't have an account? <a href="{% url 'portal:signup' %}">Sign Up</a>
        </p>
      </form>
    </div>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
